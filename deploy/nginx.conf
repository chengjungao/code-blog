# ========== HTTPS 主服务 ==========
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/ssl/nginx/chengjungao.cn.pem;
    ssl_certificate_key /etc/ssl/nginx/chengjungao.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # ========== API Proxy ==========

    # Blog API (BlogApiController)
    location /blog/api/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin API (AdminApiController)
    location /admin/api/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin CRUD APIs (original controllers)
    location ~ ^/admin/(blogs|categories|tags|comments|messages|links|configurations|upload|render)/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5M;
    }

    # Common endpoints (captcha etc.)
    location /common/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


     # api endpoints (wechat message etc.)
     location /api/ {
            proxy_pass http://127.0.0.1:28083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     }

    # Upload files (served by backend)
    location /upload/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Sitemap (dynamic, generated by backend)
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # robots.txt (static file)
    location = /robots.txt {
        root /usr/share/nginx/html/blog;
        try_files /robots.txt =404;
    }

    # llms.txt (dynamic, generated by backend)
    location = /llms.txt {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 404 error page
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html/blog;
        internal;
    }

    # ========== Admin Frontend SPA ==========
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    # ========== Blog Frontend SPA ==========
    # 路径验证（用于真实 404）
    location = /_validate_path {
        internal;
        proxy_pass http://127.0.0.1:28083/api/validate-path;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    location / {
        root /usr/share/nginx/html/blog;
        
        # 先尝试静态资源（CSS/JS/图片等）
        try_files $uri $uri/ @spa_handler;
    }

    # SPA 处理：先尝试预渲染的静态页面，再回退到 Vue SPA
    location @spa_handler {
        # 路径验证（真实 404）
        auth_request /_validate_path;
        error_page 401 403 = @not_found;
        
        # 尝试预渲染的静态页面（保持目录结构，与 render.js 一致）
        # / -> /var/blog/static-pages/index.html
        # /notes -> /var/blog/static-pages/notes.html
        # /notes/123 -> /var/blog/static-pages/notes/123.html
        # /my-path -> /var/blog/static-pages/my-path.html
        root /;
        set $static_uri $uri;
        if ($uri = '/') {
            set $static_uri /index;
        }
        try_files /var/blog/static-pages${static_uri}.html /usr/share/nginx/html/blog/index.html;
        
        # 不缓存 HTML 页面，确保每次请求都经过 auth_request 路径验证
        # （静态资源 CSS/JS/图片等由 location / 的 try_files 直接返回，有各自的缓存策略）
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Vary "Accept-Encoding";
    }

    # 404 处理
    location @not_found {
        return 404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

# ========== HTTP → HTTPS 重定向 ==========
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
