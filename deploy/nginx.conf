# ========== HTTPS 主服务 ==========
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/ssl/nginx/chengjungao.cn.pem;
    ssl_certificate_key /etc/ssl/nginx/chengjungao.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # ========== API Proxy ==========

    # Blog API (BlogApiController)
    #
    # ⚠️ 必须显式给 no-store，不要删！
    # 本站站前挂着阿里云 CDN。源站不给 Cache-Control 时，CDN 会落到自己的兜底策略，
    # 实测 /blog/api/* 全部被缓存 X-Swift-CacheTime: 86400（24 小时）。
    # 更麻烦的是响应带 Vary: Accept-Encoding（本文件 gzip_vary on 产生），CDN 按编码
    # 分变体独立缓存 —— 带 br/zstd 的那份（Chrome、预渲染用的 Puppeteer 都带）一旦存下
    # 旧数据，就是 24 小时不更新的「影子副本」：
    #   实测 /blog/api/index/1 同 URL 同刻返回两个版本，
    #   Accept-Encoding: gzip,deflate,br,zstd → totalCount=21（Age≈15h，缺新文章）
    #   Accept-Encoding: gzip,deflate        → totalCount=22（新）
    # 后果：新发布的文章在列表页最长 24 小时不可见（"少了一篇文章"），
    #       预渲染快照也会把这份旧数据固化进 pages/*.html。
    # 源站的 no-store 在 CDN 优先级链里最高，压过控制台缓存规则，是唯一根治点。
    location /blog/api/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Admin API (AdminApiController)
    # 同样必须 no-store：否则后台改完文章/配置，浏览器与 CDN 仍会拿 24 小时前的旧 JSON，
    # 表现为「后台列表看不到刚改的内容」。
    location /admin/api/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Admin CRUD APIs (original controllers)
    # 含 /admin/upload/（上传接口）、/admin/render/（手动触发预渲染），这些更不能被缓存。
    location ~ ^/admin/(blogs|categories|tags|comments|messages|links|configurations|upload|render|autoReplies)/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5M;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Common endpoints (captcha etc.)
    location /common/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }


     # api endpoints (wechat message etc.)
     location /api/ {
            proxy_pass http://127.0.0.1:28083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
     }

    # Upload files (served by backend)
    location /upload/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Sitemap (dynamic, generated by backend)
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 动态生成、随发文变化。缺这个头时 CDN 会按后缀默认规则缓存 30 天
        # （实测 X-Swift-CacheTime=2592000）→ 新文章最长 30 天不进 sitemap，
        # 搜索引擎抓到的永远是旧清单。
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # robots.txt (static file)
    location = /robots.txt {
        root /usr/share/nginx/html/blog;
        try_files /robots.txt =404;
    }

    # ========== 站点验证文件（百度 / Google 等，静态） ==========
    # 这些文件放在 frontend/web/public/ 下，Vite 构建时会原样拷到 dist 根，
    # 再随 COPY --from=build-blog /app/dist 进入镜像。
    # 必须用独立 location 绕开 pathname 校验：PathValidationController 的
    # STATIC_EXTENSIONS 白名单里没有 .html，请求落到 location / 会被判定为非法路径
    # → 403 → nginx 转 404，验证必然失败。
    # 换验证文件时无需改配置（正则按前缀匹配），把新文件丢进 public/ 即可。
    # 注意：此处刻意不用 try_files 兜底 SPA 壳，文件缺失就该老老实实 404。
    location ~ ^/(baidu_verify_|google)[A-Za-z0-9_.-]*\.html$ {
        root /usr/share/nginx/html/blog;
        try_files $uri =404;
    }

    # llms.txt (dynamic, generated by backend)
    location = /llms.txt {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 同 sitemap：动态内容，不能被 CDN 按 .txt 默认规则缓存 30 天
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # RSS/Atom 不存在，返回 404 而非空壳 200
    location = /rss.xml { return 404; }
    location = /atom.xml { return 404; }

    # 404 error page
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html/blog;
        internal;
    }

    # ========== 预渲染器专用入口（内部跳转目标） ==========
    # render.js 以 ?__prerender=1 访问页面时，nginx 用 return 418 + error_page
    # 跳转到此入口，直接返回 SPA 壳（blog/index.html），跳过 pages/ 下的旧预渲染静态文件。
    # 目的：Vue 在无内嵌旧数据（__PRELOADED_DATA__）时走 API 拉取最新内容，再由 render.js
    # 快照写回 pages/。若不绕过，渲染器每次拿到的都是上一次的预渲染文件（内嵌旧数据），
    # Vue 水合直接用旧数据且不再请求 API，导致"旧文件→旧数据→写回旧文件"的自固化，
    # 定时渲染永远不更新内容。
    # 用查询参数而非请求头：请求头会随页面所有子资源（JS/CSS/图片）一并发出，导致静态
    # 资源也被替换为 SPA 壳；查询参数只存在于主文档 URL，子资源不受影响。
    error_page 418 = @prerender_spa;
    location @prerender_spa {
        root /usr/share/nginx/html/blog;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ========== Admin 静态资源（文件名带内容 hash → 可长缓存）==========
    # 必须显式声明：不写的话阿里云 CDN 会按「后缀默认规则」缓存 30 天
    # （实测 X-Swift-CacheTime=2592000），浏览器也会走启发式新鲜度。
    # 用 ^~ 是为了跳过正则 location —— 将来若新增 /admin/xxx/ 之类的正则也不会被抢走。
    # 顺带修正一处语义：资源缺失返回真 404，而不是被 /admin/ 的 try_files 兜底成
    # 200 text/html（那会让浏览器把 HTML 当 JS 执行，报 MIME 错误）。
    location ^~ /admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ========== Admin Frontend SPA ==========
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;

        # 管理端 SPA 壳必须每次回源校验，两个理由：
        # ① 没有 Cache-Control 时，浏览器按「启发式新鲜度」= 10% × (Date − Last-Modified)
        #    自主缓存。当前 dist 的 Last-Modified 是 09-10，算出来约 31 小时 ——
        #    这期间浏览器连请求都不发，这就是「管理端 UI 像被缓存了」的直接原因。
        # ② 阿里云 CDN 面对同样的缺失会按后缀默认规则缓存 30 天。
        # 两者叠加时，发版后拿到的仍是旧 index.html；若旧 hash 资源已随新镜像消失，
        # 就会白屏。与主站 location / 保持完全相同的策略。
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Vary "Accept-Encoding";
    }

    location = /admin {
        return 301 /admin/;
    }

    # ========== Blog Frontend SPA ==========
    # 路径验证（用于真实 404）
    location = /_validate_path {
        internal;
        proxy_pass http://127.0.0.1:28083/api/validate-path;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # /notes/{id} 特殊处理：先查预渲染，再问后端是否需要 301 到 slug
    location ~ ^/notes/(\d+)$ {
        root /usr/share/nginx/html/blog;
        set $note_id $1;
        auth_request /_validate_path;
        error_page 401 403 =404 /404.html;
        # 注意：本 location 自定义了 error_page（401/403），会覆盖 server 级继承的
        # error_page 418，必须在此重复声明，否则渲染器跳转失效、直接返回 418
        error_page 418 = @prerender_spa;

        # 预渲染器（?__prerender=1）：跳过 pages 静态文件，直接返回 SPA 壳，
        # 由 Vue 从 API 拉取最新内容，避免旧预渲染文件自固化（见 @prerender_spa 注释）
        if ($arg___prerender = "1") {
            return 418;
        }

        # 有预渲染文件则直接返回；否则进入重定向检查
        try_files /pages/notes/$1.html /pages/notes/$1/index.html @note_redirect_check;

        add_header Cache-Control "no-cache, must-revalidate";
        add_header Vary "Accept-Encoding";
    }

    # 后端判断 /notes/{id} 是否需要 301 到自定义路径
    location @note_redirect_check {
        proxy_pass http://127.0.0.1:28083/api/note-redirect/$note_id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        # 后端返回 404 表示无 slug，回退到 SPA
        error_page 404 = @spa_serve;
    }

    # 无 slug 的 /notes/{id}，返回 SPA 壳由 Vue 渲染
    location @spa_serve {
        root /usr/share/nginx/html/blog;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ========== 站点静态资源（文件名带内容 hash → 可长缓存）==========
    # dist/assets 下 143 个 js/css/png 全部形如 [name]-[hash].[ext]，内容一变文件名就变，
    # 因此可以安全地 1 年 immutable。原先这些请求落在 location / 里被标成 no-cache，
    # 于是每次页面加载都要为十几个资源各发一次 auth_request 子请求回源校验，首屏白白变慢。
    # 顺带修正一处语义：资源不存在时返回真 404，而不是被兜底成 200 的 SPA 壳。
    location ^~ /assets/ {
        root /usr/share/nginx/html/blog;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        root /usr/share/nginx/html/blog;

        # ========== 尾斜杠统一 301 到无尾斜杠版本 ==========
        # 背景：PathValidationController 在判定前会剥掉末尾斜杠（所以 /notes/ 能通过校验），
        # 但 nginx 的 try_files 用的仍是原始 URI，会命中 pages/ 下的真实目录
        # （因为 pages/notes/2.html 存在，pages/notes/ 就是一个目录）→ 目录内没有 index.html
        # → 一路兜底到 /index.html，于是 /notes/ 变成「200 + 23 字空壳 + canonical 指向首页」。
        # 爬虫试探尾斜杠变体是常见行为，对它是空白页 + 重复内容双重负面信号。
        # 根路径 "/" 不匹配本规则；/admin/、/blog/api/ 等有各自更长的前缀 location，不会落到这里。
        if ($uri ~ "^(.+)/$") {
            return 301 $1$is_args$args;
        }

        # 路径验证（真实 404）
        auth_request /_validate_path;
        error_page 401 403 =404 /404.html;
        # 注意：本 location 自定义了 error_page（401/403），会覆盖 server 级继承的
        # error_page 418，必须在此重复声明，否则渲染器跳转失效、直接返回 418
        error_page 418 = @prerender_spa;

        # 预渲染器（?__prerender=1）：跳过 pages 静态文件，直接返回 SPA 壳（见 @prerender_spa 注释）
        if ($arg___prerender = "1") {
            return 418;
        }

        # 1. 静态资源（CSS/JS/图片）由 root 直接返回
        # 2. 预渲染页面（pages/ 子目录）
        # 3. 回退到 SPA index.html（同 root 下，不会触发重定向循环）
        try_files $uri /pages${uri}.html /pages${uri}/index.html /index.html;

        # 不缓存 HTML，确保每次请求都经过 auth_request 验证
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Vary "Accept-Encoding";
    }


    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

# ========== HTTP → HTTPS 重定向 ==========
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
