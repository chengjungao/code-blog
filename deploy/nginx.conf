# ========== HTTPS 主服务 ==========
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/ssl/nginx/chengjungao.cn.pem;
    ssl_certificate_key /etc/ssl/nginx/chengjungao.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # ========== API Proxy ==========

    # Blog API (BlogApiController)
    location /blog/api/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin API (AdminApiController)
    location /admin/api/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin CRUD APIs (original controllers)
    location ~ ^/admin/(blogs|categories|tags|comments|messages|links|configurations|upload|render|autoReplies)/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5M;
    }

    # Common endpoints (captcha etc.)
    location /common/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


     # api endpoints (wechat message etc.)
     location /api/ {
            proxy_pass http://127.0.0.1:28083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     }

    # Upload files (served by backend)
    location /upload/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Sitemap (dynamic, generated by backend)
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # robots.txt (static file)
    location = /robots.txt {
        root /usr/share/nginx/html/blog;
        try_files /robots.txt =404;
    }

    # llms.txt (dynamic, generated by backend)
    location = /llms.txt {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RSS/Atom 不存在，返回 404 而非空壳 200
    location = /rss.xml { return 404; }
    location = /atom.xml { return 404; }

    # 404 error page
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html/blog;
        internal;
    }

    # ========== 预渲染器专用入口（内部跳转目标） ==========
    # render.js 以 ?__prerender=1 访问页面时，nginx 用 return 418 + error_page
    # 跳转到此入口，直接返回 SPA 壳（blog/index.html），跳过 pages/ 下的旧预渲染静态文件。
    # 目的：Vue 在无内嵌旧数据（__PRELOADED_DATA__）时走 API 拉取最新内容，再由 render.js
    # 快照写回 pages/。若不绕过，渲染器每次拿到的都是上一次的预渲染文件（内嵌旧数据），
    # Vue 水合直接用旧数据且不再请求 API，导致"旧文件→旧数据→写回旧文件"的自固化，
    # 定时渲染永远不更新内容。
    # 用查询参数而非请求头：请求头会随页面所有子资源（JS/CSS/图片）一并发出，导致静态
    # 资源也被替换为 SPA 壳；查询参数只存在于主文档 URL，子资源不受影响。
    error_page 418 = @prerender_spa;
    location @prerender_spa {
        root /usr/share/nginx/html/blog;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ========== Admin Frontend SPA ==========
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    # ========== Blog Frontend SPA ==========
    # 路径验证（用于真实 404）
    location = /_validate_path {
        internal;
        proxy_pass http://127.0.0.1:28083/api/validate-path;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # /notes/{id} 特殊处理：先查预渲染，再问后端是否需要 301 到 slug
    location ~ ^/notes/(\d+)$ {
        root /usr/share/nginx/html/blog;
        set $note_id $1;
        auth_request /_validate_path;
        error_page 401 403 =404 /404.html;
        # 注意：本 location 自定义了 error_page（401/403），会覆盖 server 级继承的
        # error_page 418，必须在此重复声明，否则渲染器跳转失效、直接返回 418
        error_page 418 = @prerender_spa;

        # 预渲染器（?__prerender=1）：跳过 pages 静态文件，直接返回 SPA 壳，
        # 由 Vue 从 API 拉取最新内容，避免旧预渲染文件自固化（见 @prerender_spa 注释）
        if ($arg___prerender = "1") {
            return 418;
        }

        # 有预渲染文件则直接返回；否则进入重定向检查
        try_files /pages/notes/$1.html /pages/notes/$1/index.html @note_redirect_check;

        add_header Cache-Control "no-cache, must-revalidate";
        add_header Vary "Accept-Encoding";
    }

    # 后端判断 /notes/{id} 是否需要 301 到自定义路径
    location @note_redirect_check {
        proxy_pass http://127.0.0.1:28083/api/note-redirect/$note_id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        # 后端返回 404 表示无 slug，回退到 SPA
        error_page 404 = @spa_serve;
    }

    # 无 slug 的 /notes/{id}，返回 SPA 壳由 Vue 渲染
    location @spa_serve {
        root /usr/share/nginx/html/blog;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html/blog;

        # 路径验证（真实 404）
        auth_request /_validate_path;
        error_page 401 403 =404 /404.html;
        # 注意：本 location 自定义了 error_page（401/403），会覆盖 server 级继承的
        # error_page 418，必须在此重复声明，否则渲染器跳转失效、直接返回 418
        error_page 418 = @prerender_spa;

        # 预渲染器（?__prerender=1）：跳过 pages 静态文件，直接返回 SPA 壳（见 @prerender_spa 注释）
        if ($arg___prerender = "1") {
            return 418;
        }

        # 1. 静态资源（CSS/JS/图片）由 root 直接返回
        # 2. 预渲染页面（pages/ 子目录）
        # 3. 回退到 SPA index.html（同 root 下，不会触发重定向循环）
        try_files $uri /pages${uri}.html /pages${uri}/index.html /index.html;

        # 不缓存 HTML，确保每次请求都经过 auth_request 验证
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Vary "Accept-Encoding";
    }


    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

# ========== HTTP → HTTPS 重定向 ==========
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
