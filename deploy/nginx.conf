# ========== HTTPS 主服务 ==========
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/ssl/nginx/chengjungao.cn.pem;
    ssl_certificate_key /etc/ssl/nginx/chengjungao.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # ========== API Proxy ==========

    # Blog API (BlogApiController)
    location /blog/api/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin API (AdminApiController)
    location /admin/api/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin CRUD APIs (original controllers)
    location ~ ^/admin/(blogs|categories|tags|comments|messages|links|configurations|upload|render)/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5M;
    }

    # Common endpoints (captcha etc.)
    location /common/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


     # api endpoints (wechat message etc.)
     location /api/ {
            proxy_pass http://127.0.0.1:28083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     }

    # Upload files (served by backend)
    location /upload/ {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Sitemap (dynamic, generated by backend)
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # robots.txt (static file)
    location = /robots.txt {
        root /usr/share/nginx/html/blog;
        try_files /robots.txt =404;
    }

    # llms.txt (dynamic, generated by backend)
    location = /llms.txt {
        proxy_pass http://127.0.0.1:28083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 404 error page
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html/blog;
        internal;
    }

    # ========== Admin Frontend SPA ==========
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    # ========== Blog Frontend SPA ==========
    # 路径验证（用于真实 404）
    location = /_validate_path {
        internal;
        proxy_pass http://127.0.0.1:28083/api/validate-path;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    location / {
        root /usr/share/nginx/html/blog;

        # 路径验证（真实 404）
        auth_request /_validate_path;
        error_page 401 403 = @not_found;

        # 1. 静态资源（CSS/JS/图片）由 root 直接返回
        # 2. 预渲染页面（pages/ 子目录）
        # 3. 回退到 SPA index.html（同 root 下，不会触发重定向循环）
        try_files $uri /pages${uri}.html /pages${uri}/index.html /index.html;

        # 不缓存 HTML，确保每次请求都经过 auth_request 验证
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Vary "Accept-Encoding";
    }

    # 404 处理
    location @not_found {
        return 404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

# ========== HTTP → HTTPS 重定向 ==========
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
