server:
  port: 28083

spring:
  profiles:
    active: dev,local
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    name: my-blog-datasource
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 25
      auto-commit: true
      idle-timeout: 30000
      pool-name: hikariCP
      max-lifetime: 30000
      connection-timeout: 30000
      connection-test-query: SELECT 1

mybatis:
  mapper-locations: classpath:mapper/*Mapper.xml

# custom config
file:
  attachment: data/

# 访问明细（埋点）落盘
#
# 埋点接口只做「收下 + 入队」就返回，写文件由单消费者线程批量完成。
# queue-capacity 故意做小：它只是削峰缓冲，不是数据仓库。真积压到上千条，
# 说明磁盘/文件系统已经出问题，此时丢弃并计数（报表「数据健康」可见）比堆积更安全。
# ip-mode: full（明细里保留完整 IP，便于核对 CDN 的 XFF 链路）| mask（只留网段，隐私优先）
page-stat:
  enabled: true
  log-dir: data/page-stat
  queue-capacity: 2000
  batch-size: 500
  retain-days: 90
  ip-mode: full
