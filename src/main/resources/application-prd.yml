# production 环境配置
file:
  attachment: /var/blog/data/

blog:
  base-url: ${BLOG_BASE_URL:https://www.chengjungao.cn}

solr:
  home: /var/blog/solr/

chat:
  server:
    url: ${CHAT_SERVER_URL:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
  model: ${CHAT_MODEL:doubao-seed-2-1-turbo-260628}

vision:
  server:
    url: ${VISION_SERVER_URL:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
  token: ${VISION_TOKEN:}
  model: ${VISION_MODEL:doubao-seed-2-1-turbo-260628}

# 大模型「思考开关」参数风格：ark | glm-level | qwen | glm | none
# 回退 GLM 时设为 glm / glm-level
llm:
  thinking-style: ${LLM_THINKING_STYLE:ark}
  vision-thinking-style: ${LLM_VISION_THINKING_STYLE:ark}
